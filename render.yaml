services:
  - type: web
    name: MocPhuong-Docker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      # Database - nhập Internal Database URL của DB hiện tại
      - key: DATABASE_URL
        sync: false

      # Rails
      - key: RAILS_MASTER_KEY
        sync: false

      - key: SECRET_KEY_BASE
        sync: false

      - key: WEB_CONCURRENCY
        value: 2

      # Admin
      - key: ADMIN_EMAILS
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Facebook OAuth
      - key: FACEBOOK_APP_ID
        sync: false

      - key: FACEBOOK_APP_SECRET
        sync: false

      # AWS S3
      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      - key: AWS_REGION
        value: ap-southeast-1

      # Resend
      - key: RESEND_API_KEY
        sync: false

      - key: ADMIN_GET_MAILS
        sync: false

      # Mail
      - key: MAILER_PASSWORD
        sync: false

      - key: MAILER_FROM_EMAIL
        sync: false
        