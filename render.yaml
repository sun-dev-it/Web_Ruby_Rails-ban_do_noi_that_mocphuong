services:
  - type: web
    name: MocPhuong
    runtime: ruby
    plan: free

    buildCommand: "./bin/render-build.sh"
    startCommand: "./bin/rails server"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: MocPhuong-db
          property: connectionString

      - key: RAILS_MASTER_KEY
        sync: false

      - key: WEB_CONCURRENCY
        value: 2

      # Admin
      - key: ADMIN_EMAILS
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Facebook OAuth
      - key: FACEBOOK_APP_ID
        sync: false

      - key: FACEBOOK_APP_SECRET
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: MocPhuong-db
    plan: free