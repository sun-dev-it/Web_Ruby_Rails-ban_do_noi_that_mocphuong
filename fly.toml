# fly.toml app configuration file generated for web-ruby-rails-ban-do-noi-that-mocphuong on 2026-10-21T08:41:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'web-ruby-rails-ban-do-noi-that-mocphuong'
primary_region = 'iad'
console_command = '/rails/bin/rails console'

[build]

[deploy]
  release_command = './bin/rails db:prepare'

[env]
  PORT = '8080'

[processes]
  app = './bin/rails server'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
